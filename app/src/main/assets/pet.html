<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:transparent;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

#pet-container {
  position:absolute;
  bottom:0; left:50%;
  transform:translateX(-50%);
  width:160px; height:160px;
}

#pet-container img {
  width:100%; height:100%;
  display:block;
}

.poke-flash {
  animation: poke-bright 0.2s ease-out;
}
@keyframes poke-bright {
  0% { filter:brightness(1.4); }
  100% { filter:brightness(1); }
}
</style>
</head>
<body>

<div id="pet-container">
  <img id="pet-svg" src="clawd-idle-living.svg" alt="Clawd">
</div>

<script>
(function(){
  var STATES = {
    idle:     'clawd-idle-living',
    look:     'clawd-idle-look',
    yawn:     'clawd-idle-yawn',
    reading:  'clawd-idle-reading',
    happy:    'clawd-happy',
    heart:    'clawd-heart-eyes',
    shy:      'clawd-aegyo-shy',
    dizzy:    'clawd-dizzy',
    error:    'clawd-error',
    wake:     'clawd-wake',
    thinking: 'clawd-working-thinking',
    typing:   'clawd-working-typing',
    building: 'clawd-working-building',
    juggling: 'clawd-working-juggling',
    wizard:   'clawd-working-wizard',
    outlaw:   'clawd-outlaw-bender',
    sleeping: 'clawd-sleeping',
    collapse: 'clawd-collapse-sleep',
    coffee:   'clawd-coffee-hand',
    music:    'clawd-headphones-groove'
  };

  var IDLE_STATES = ['idle','look','yawn','reading','coffee','music'];
  var TAP_REACTIONS = ['happy','shy','wake','heart'];
  var COMBO_REACTIONS = ['dizzy','error','outlaw'];

  var currentState = 'idle';
  var idleTimer = null;
  var sleepTimer = null;
  var revertTimer = null;

  var petImg = document.getElementById('pet-svg');
  var container = document.getElementById('pet-container');

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function setSvg(stateKey) {
    currentState = stateKey;
    var file = STATES[stateKey];
    if (file) petImg.src = file + '.svg';
  }

  function flashPoke() {
    container.classList.add('poke-flash');
    setTimeout(function(){
      container.classList.remove('poke-flash');
    }, 200);
  }

  function revertToIdle(delay) {
    clearTimeout(revertTimer);
    revertTimer = setTimeout(function(){
      setSvg('idle');
      resetIdleTimer();
    }, delay || 3000);
  }

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    clearTimeout(sleepTimer);

    idleTimer = setTimeout(function(){
      var s = pick(IDLE_STATES);
      setSvg(s);
      resetIdleTimer();
    }, 12000 + Math.random() * 13000);

    sleepTimer = setTimeout(function(){
      clearTimeout(idleTimer);
      setSvg('sleeping');
    }, 120000 + Math.random() * 60000);
  }

  function wakeUp() {
    clearTimeout(idleTimer);
    clearTimeout(sleepTimer);
    clearTimeout(revertTimer);
    if (currentState === 'sleeping' || currentState === 'collapse') {
      setSvg('wake');
      revertToIdle(2000);
    }
  }

  window.petEngine = {
    onTap: function() {
      if (currentState === 'sleeping' || currentState === 'collapse') {
        wakeUp();
        return;
      }
      flashPoke();
      setSvg(pick(TAP_REACTIONS));
      revertToIdle(3000);
    },

    onDoubleTap: function() {
      if (currentState === 'sleeping' || currentState === 'collapse') {
        wakeUp();
        return;
      }
      flashPoke();
      setSvg('heart');
      revertToIdle(3000);
    },

    onLongPress: function() {
      if (currentState === 'sleeping' || currentState === 'collapse') {
        wakeUp();
        return;
      }
      setSvg('shy');
      revertToIdle(4000);
    },

    onComboTap: function(level) {
      if (currentState === 'sleeping' || currentState === 'collapse') {
        wakeUp();
        return;
      }
      flashPoke();
      level = Math.min(level, 3);
      var idx = level - 1;
      setSvg(COMBO_REACTIONS[idx] || 'dizzy');
      var delay = level >= 3 ? 5000 : 3500;
      revertToIdle(delay);
    },

    say: function(text, emotion) {
      if (currentState === 'sleeping' || currentState === 'collapse') {
        wakeUp();
      }
      clearTimeout(revertTimer);
      if (emotion && STATES[emotion]) {
        setSvg(emotion);
      } else {
        setSvg('thinking');
      }
      revertToIdle(5000);
    },

    setState: function(stateKey) {
      if (STATES[stateKey]) {
        setSvg(stateKey);
        resetIdleTimer();
      }
    }
  };

  resetIdleTimer();
})();
</script>
</body>
</html>
